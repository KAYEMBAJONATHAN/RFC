<div *ngIf="!isLoggedIn()" class="login-container">
  <form (ngSubmit)="login(username.value, email.value, password.value)">
    <label for="username">Username:</label>
    <input type="text" id="username" #username name="username" required />

    <label for="email">Email:</label>
    <input type="email" id="email" #email name="email" required />

    <label for="password">Password:</label>
    <input type="password" id="password" #password name="password" required />

    <button type="submit" (click)="login(username.value, email.value, password.value)">Login</button>
  </form>
</div>
<p class="route">Don't have an account? <a routerLink="/signup">Sign up here</a></p>
