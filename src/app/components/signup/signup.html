<div class="content">
  <h2>Sign Up</h2>
  <form [formGroup]="signupForm" (ngSubmit)="signup()">
    <input formControlName="username" placeholder="Username" class="input" />
    <div *ngIf="signupForm.get('username')?.touched && signupForm.get('username')?.invalid" class="error">
      <span *ngIf="signupForm.get('username')?.errors?.['required']">Username is required.</span>
      <span *ngIf="signupForm.get('username')?.errors?.['minlength']">Minimum 3 characters.</span>
    </div>

    <input formControlName="email" placeholder="Email" class="input" />
    <div *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid" class="error">
      <span *ngIf="signupForm.get('email')?.errors?.['required']">Email is required.</span>
      <span *ngIf="signupForm.get('email')?.errors?.['email']">Invalid email format.</span>
    </div>

    <input formControlName="password" type="password" placeholder="Password" class="input" />
    <div *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid" class="error">
      <span *ngIf="signupForm.get('password')?.errors?.['required']">Password is required.</span>
      <span *ngIf="signupForm.get('password')?.errors?.['minlength']">Minimum 8 characters.</span>
      <span *ngIf="signupForm.get('password')?.errors?.['pattern']">
        Must include uppercase, lowercase, number, and special character.
      </span>
    </div>

    <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
  </form>
</div>

<p class="route">Already have an account? <a routerLink="/login">Login here</a></p>
